<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management System</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="crud">
        <div class="head">
            <h2>Store Name</h2>
            <p>PRODUCT MANAGEMENT SYSTEM</p>
        </div>
        <div class="inputs">
            <input type="text" id="title" placeholder="title:">
            <div class="price">
            <input onkeyup="gettotal()" type="number" id="price" placeholder="price">
            <input onkeyup="gettotal()" type="number" id="taxes" placeholder="taxes" >
            <input onkeyup="gettotal()" type="number" id="ads" placeholder="ads">
            <input onkeyup="gettotal()" type="number" id="discount" placeholder="discount">
            <small  id="total"></small>
           </div>
           <input type="number" id="count" placeholder="count">
           <input type="text" id="category" placeholder="CATEGORY">
           <button  id="submit">Create</button>
        </div>
        <div class="outputs">
            <div class="searchblock">
                <input onkeyup="searchdata(this.value)" type="text" id="search" placeholder="Search">
<div class="btnsearch">
    <button onclick="getsearchmood(this.id)" id="searchtitle"><h4>Search By Title</h4></button>
    <button onclick="getsearchmood(this.id)" id="searchcategory"><h4>Search By Category</h4></button>
</div>
            </div>
            <div id="deleteall">

            </div>
            <table>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Texes</th>
                    <th>Ads</th>
                    <th>Discount</th>
                    <th>Total</th>
                    <th>Category</th>
                    <th>Update</th>
                    <th>Delete</th>
                </tr>
                <tbody id="tbody">

            </tbody>
            </table>
        </div>
    </div>
<script src="main.js"></script>
</body>
</html>
